plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joemo.razeredgefan'
    compileSdk 36

    defaultConfig {
        applicationId 'com.joemo.razeredgefan'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl true
    }
}

dependencies {
    // The device has no su binary (not Magisk-rooted), but `adb root` works. Shizuku lets the
    // app get that same privilege level at runtime (its server is bootstrapped once from a
    // rooted adb shell) without needing a real root solution installed.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
